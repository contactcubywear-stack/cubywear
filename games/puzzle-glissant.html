<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Cubiwear – Puzzle glissant</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/puzzle-glissant.css">
</head>

<body>

  <button id="langToggle" class="lang-toggle">FR</button>

  <h1>🧩 Puzzle glissant</h1>
  <p id="moves">0</p>

  <div class="size-toggle">
    <button class="btn-small size-btn" data-size="3">3×3</button>
    <button class="btn-small size-btn active" data-size="4">4×4</button>
    <button class="btn-small size-btn" data-size="5">5×5</button>
  </div>

  <div class="puzzle-board" id="board"></div>

  <p class="hint" data-i18n="hint">Glisse, utilise les flèches ou les boutons pour déplacer les pièces</p>

  <div class="dpad">
    <button class="btn-small dpad-up" id="btnUp" aria-label="Haut">▲</button>
    <div class="dpad-row">
      <button class="btn-small dpad-left" id="btnLeft" aria-label="Gauche">◀</button>
      <button class="btn-small dpad-down" id="btnDown" aria-label="Bas">▼</button>
      <button class="btn-small dpad-right" id="btnRight" aria-label="Droite">▶</button>
    </div>
  </div>

  <div class="actions">
    <button class="btn-small" id="shuffleBtn" data-i18n="shuffle">Mélanger</button>
    <a href="../index.html" class="btn-small" data-i18n="home">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 data-i18n="winTitle">🎉 Résolu !</h2>
      <div class="stars" id="starsRow">☆☆☆</div>
      <div class="win-stats">
        <p><span data-i18n="movesLabel">Coups</span> : <span id="statMoves"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn" data-i18n="replay">Rejouer</button>
        <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
      </div>
    </div>
  </div>

  <script src="../js/sfx.js"></script>
  <script type="module" src="../js/puzzle-glissant.js"></script>
</body>
</html>
