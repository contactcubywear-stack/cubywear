<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cubiwear – Mini-Tetris</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/mini-tetris.css">
</head>

<body>

  <h1>🧱 Mini-Tetris</h1>
  <p id="score">Score : 0</p>

  <div class="tetris-board" id="board"></div>

  <div class="tetris-controls">
    <button class="btn-small" id="btnLeft" aria-label="Gauche">◀</button>
    <button class="btn-small" id="btnRotate" aria-label="Tourner">⟳</button>
    <button class="btn-small" id="btnRight" aria-label="Droite">▶</button>
    <button class="btn-small" id="btnDown" aria-label="Bas">▼</button>
  </div>

  <div class="actions">
    <a href="../games/mini-tetris.html" class="btn-small">Rejouer</a>
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2>💥 Perdu !</h2>
      <div class="win-stats">
        <p>Score final : <span id="statScore"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/mini-tetris.js"></script>
</body>
</html>
