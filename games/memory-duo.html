<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>CubyWear – Memory Duo+</title>
  <link rel="icon" type="image/png" href="/assets/logo_dark.png">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/memory-duo.css">
</head>

<body>

  <button id="langToggle" class="lang-toggle">FR</button>

  <h1>🧠✨ Memory Duo+</h1>

  <div class="difficulty-select" id="difficultySelect">
    <p data-i18n="chooseDifficulty">Choisis la difficulté</p>
    <div class="difficulty-buttons">
      <button class="btn-small" data-difficulty="facile" data-i18n="easy">Facile</button>
      <button class="btn-small" data-difficulty="moyen" data-i18n="medium">Moyen</button>
      <button class="btn-small" data-difficulty="difficile" data-i18n="hard">Difficile</button>
      <button class="btn-small" data-difficulty="impossible" data-i18n="impossible">Impossible</button>
    </div>
    <div class="actions">
      <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
    </div>
  </div>

  <div id="gameArea" hidden>
    <p id="timer">01:00</p>
    <p id="info">0</p>
    <p class="hint" data-i18n="hint">Attention, les cartes non trouvées bougent de temps en temps !</p>

    <div class="memory-duo-container" id="gameBoard"></div>

    <div class="actions">
      <a href="../index.html" class="btn-small" data-i18n="home">Accueil</a>
    </div>
  </div>

  <div class="win-modal" id="winModal" hidden>
    <div class="win-modal-content">
      <h2 data-i18n="winTitle">🎉 Bravo, tu as gagné !</h2>
      <div class="win-stats">
        <p><span data-i18n="moves">Coups joués</span> : <span id="statMoves"></span></p>
        <p><span data-i18n="timeLeft">Temps restant</span> : <span id="statTime"></span></p>
        <p><span data-i18n="best">Meilleur score</span> : <span id="statBest"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn" data-i18n="replay">Rejouer</button>
        <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
      </div>
    </div>
  </div>

  <div class="win-modal" id="loseModal" hidden>
    <div class="win-modal-content">
      <h2 data-i18n="loseTitle">😕 Temps écoulé !</h2>
      <div class="win-stats">
        <p><span data-i18n="moves">Coups joués</span> : <span id="loseStatMoves"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="loseReplayBtn" data-i18n="replay">Rejouer</button>
        <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
      </div>
    </div>
  </div>

  <script src="../js/sfx.js"></script>
  <script type="module" src="../js/memory-duo.js"></script>
</body>
</html>
