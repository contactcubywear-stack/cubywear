<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cubiwear – Runner 2D</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/runner-2d.css">
</head>

<body>

  <h1>🦘 Runner 2D</h1>
  <p id="score">Score : 0</p>

  <div class="runner2d-area" id="area">
    <canvas id="gameCanvas"></canvas>
    <div class="runner2d-start" id="startOverlay">
      <button class="btn-small" id="startBtn">Commencer</button>
    </div>
  </div>

  <p class="hint">Clique, appuie sur Espace ou touche l'écran pour sauter</p>

  <div class="actions">
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2>💥 Game Over !</h2>
      <div class="win-stats">
        <p>Score : <span id="statScore"></span></p>
        <p>Meilleur score : <span id="statBest"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/runner-2d.js"></script>
</body>
</html>
