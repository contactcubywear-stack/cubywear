<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>CubyWear – Flow Libre</title>
  <link rel="icon" type="image/png" href="/assets/logo_dark.png">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/arcade-shared.css">
  <link rel="stylesheet" href="../css/flow-free.css">
</head>

<body>

  <button id="langToggle" class="lang-toggle">FR</button>

  <h1>🌈 Flow Libre</h1>

  <div class="difficulty-select" id="difficultySelect">
    <p data-i18n="chooseDifficulty">Choisis la difficulté</p>
    <div class="difficulty-buttons">
      <button class="btn-small" data-difficulty="facile" data-i18n="easy">Facile</button>
      <button class="btn-small" data-difficulty="moyen" data-i18n="medium">Moyen</button>
      <button class="btn-small" data-difficulty="difficile" data-i18n="hard">Difficile</button>
      <button class="btn-small" data-difficulty="impossible" data-i18n="impossible">Impossible</button>
    </div>
    <div class="actions">
      <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
    </div>
  </div>

  <div id="gameArea" hidden>
    <div class="stat-bar">
      <div class="stat-chip"><span class="stat-icon">🔗</span><span id="movesVal">0/0</span></div>
      <div class="stat-chip"><span class="stat-icon">⏱️</span><span id="timeVal">00:00</span></div>
    </div>

    <p class="hint" data-i18n="hint">Glisse ton doigt d'un rond à l'autre de la même couleur, sans croiser les autres tuyaux</p>

    <div class="flow-canvas-wrap">
      <canvas id="game"></canvas>
    </div>

    <div class="actions">
      <button class="btn-small" id="newGameBtn" data-i18n="newGame">Nouvelle grille</button>
      <a href="../index.html" class="btn-small" data-i18n="home">Accueil</a>
    </div>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 data-i18n="win">🎉 Terminé !</h2>
      <div class="win-stats">
        <p><span data-i18n="finalTime">Temps</span> : <span id="statTime"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn" data-i18n="replay">Rejouer</button>
        <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
      </div>
    </div>
  </div>

  <script src="../js/sfx.js"></script>
  <script type="module" src="../js/flow-free.js"></script>
</body>
</html>
