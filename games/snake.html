<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cubiwear – Snake</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/snake.css">
</head>

<body>

  <h1>🐍 Snake</h1>
  <p id="score">Score : 0</p>

  <div class="snake-board" id="board"></div>

  <div class="dpad">
    <button class="btn-small dpad-up" id="btnUp" aria-label="Haut">▲</button>
    <div class="dpad-row">
      <button class="btn-small dpad-left" id="btnLeft" aria-label="Gauche">◀</button>
      <button class="btn-small dpad-down" id="btnDown" aria-label="Bas">▼</button>
      <button class="btn-small dpad-right" id="btnRight" aria-label="Droite">▶</button>
    </div>
  </div>

  <div class="actions">
    <a href="../games/snake.html" class="btn-small">Rejouer</a>
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2>💥 Perdu !</h2>
      <div class="win-stats">
        <p>Score final : <span id="statScore"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/snake.js"></script>
</body>
</html>
