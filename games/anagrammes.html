<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cubiwear – Anagrammes</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/anagrammes.css">
</head>

<body>

  <h1>🔤 Anagrammes</h1>
  <p id="hud">Mot 1/10 · Temps : 20s</p>

  <div class="answer-row" id="answerRow"></div>

  <div class="letters-row" id="lettersRow"></div>

  <div class="anagram-actions">
    <button class="btn-small" id="clearBtn">Effacer</button>
  </div>

  <div class="actions">
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2>🔤 Terminé !</h2>
      <div class="win-stats">
        <p>Mots trouvés : <span id="statScore"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/anagrammes.js"></script>
</body>
</html>
