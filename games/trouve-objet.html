<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cubiwear – Trouve l'objet</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/trouve-objet.css">
</head>

<body>

  <h1>🔍 Trouve l'objet</h1>
  <p id="target">Trouve : <span id="targetIcon"></span></p>
  <p id="hud">Manche 1/8 · Temps : 8s</p>

  <div class="objet-grid" id="grid"></div>

  <div class="actions">
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 id="resultTitle"></h2>
      <div class="win-stats">
        <p>Manches réussies : <span id="statScore"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/trouve-objet.js"></script>
</body>
</html>
