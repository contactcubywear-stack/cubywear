<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>CubyWear – 2048 Lite</title>
  <link rel="icon" type="image/png" href="/assets/logo_dark.png">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/2048.css">
</head>

<body>

  <button id="langToggle" class="lang-toggle">FR</button>

  <h1>🔢 2048 Lite</h1>

  <div class="difficulty-select" id="difficultySelect">
    <p data-i18n="chooseDifficulty">Choisis la difficulté</p>
    <div class="difficulty-buttons">
      <button class="btn-small" data-difficulty="facile">
        <span data-i18n="easy">Facile</span><br><small data-i18n="easyDesc">5×5 · objectif 512</small>
      </button>
      <button class="btn-small" data-difficulty="moyen">
        <span data-i18n="medium">Moyen</span><br><small data-i18n="mediumDesc">4×4 · objectif 1024</small>
      </button>
      <button class="btn-small" data-difficulty="difficile">
        <span data-i18n="hard">Difficile</span><br><small data-i18n="hardDesc">4×4 · objectif 2048</small>
      </button>
      <button class="btn-small" data-difficulty="impossible">
        <span data-i18n="impossible">Impossible</span><br><small data-i18n="impossibleDesc">3×3 · objectif 2048</small>
      </button>
    </div>
    <div class="actions">
      <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
    </div>
  </div>

  <div id="gameArea" hidden>
    <div class="stat-bar">
      <div class="stat-chip"><span class="stat-icon">⭐</span><span id="score">0</span></div>
      <div class="stat-chip"><span class="stat-icon">🏆</span><span id="best">0</span></div>
      <div class="stat-chip"><span class="stat-icon">🎯</span><span id="target">2048</span></div>
    </div>

    <div class="board-2048" id="board"></div>

    <p class="hint" data-i18n="hint">Glisse, utilise les flèches ou les boutons pour bouger les tuiles</p>

    <div class="dpad">
      <button class="btn-small dpad-up" id="btnUp" aria-label="Haut">▲</button>
      <div class="dpad-row">
        <button class="btn-small dpad-left" id="btnLeft" aria-label="Gauche">◀</button>
        <button class="btn-small dpad-down" id="btnDown" aria-label="Bas">▼</button>
        <button class="btn-small dpad-right" id="btnRight" aria-label="Droite">▶</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn-small" id="changeDiffBtn" data-i18n="changeLevel">Changer niveau</button>
      <a href="../index.html" class="btn-small" data-i18n="home">Accueil</a>
    </div>
  </div>

  <div class="win-banner" id="winBanner" hidden>
    <span id="winBannerText"></span>
    <button class="btn-small" id="winBannerClose" data-i18n="continueGame">Continuer</button>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 data-i18n="gameOver">💥 Plus aucun mouvement possible !</h2>
      <div class="win-stats">
        <p><span data-i18n="finalScore">Score final</span> : <span id="statScore"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn" data-i18n="replay">Rejouer</button>
        <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
      </div>
    </div>
  </div>

  <script src="../js/sfx.js"></script>
  <script type="module" src="../js/2048.js"></script>
</body>
</html>
