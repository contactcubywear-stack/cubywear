<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Cubiwear – Connect 4 Lite</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/connect4-lite.css">
</head>

<body>

  <button id="langToggle" class="lang-toggle">FR</button>

  <h1>🔴🟡 Connect 4 Lite</h1>

  <div class="difficulty-select" id="difficultySelect">
    <p data-i18n="chooseDifficulty">Choisis la difficulté</p>
    <div class="difficulty-buttons">
      <button class="btn-small" data-difficulty="facile" data-i18n="easy">Facile</button>
      <button class="btn-small" data-difficulty="moyen" data-i18n="medium">Moyen</button>
      <button class="btn-small" data-difficulty="difficile" data-i18n="hard">Difficile</button>
      <button class="btn-small" data-difficulty="impossible" data-i18n="impossible">Impossible</button>
    </div>
    <div class="actions">
      <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
    </div>
  </div>

  <div id="gameArea" hidden>
    <div class="scoreboard" id="scoreboard"></div>
    <p id="status" data-i18n="yourTurn">À toi de jouer</p>

    <div class="connect4-board" id="board"></div>

    <div class="actions">
      <button class="btn-small" id="changeDiffBtn" data-i18n="changeLevel">Changer niveau</button>
      <a href="../index.html" class="btn-small" data-i18n="home">Accueil</a>
    </div>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 id="resultTitle"></h2>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn" data-i18n="replay">Rejouer</button>
        <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
      </div>
    </div>
  </div>

  <script src="../js/sfx.js"></script>
  <script type="module" src="../js/connect4-lite.js"></script>
</body>
</html>
