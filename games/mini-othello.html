<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Cubiwear – Mini-Othello</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/mini-othello.css">
</head>

<body>

  <h1>⚫⚪ Mini-Othello</h1>
  <p id="hud">⚫ Toi : 2 · ⚪ Bot : 2</p>
  <p id="status">À toi de jouer</p>

  <div class="othello-board" id="board"></div>

  <div class="actions">
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 id="resultTitle"></h2>
      <div class="win-stats">
        <p>⚫ Toi : <span id="statPlayer"></span></p>
        <p>⚪ Bot : <span id="statBot"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/mini-othello.js"></script>
</body>
</html>
