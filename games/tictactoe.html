<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>CubyWear – Tic Tac Toe</title>
  <link rel="icon" type="image/png" href="/assets/logo_dark.png">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/tictactoe.css">
</head>

<body>

  <button id="langToggle" class="lang-toggle">FR</button>

  <h1>❌⭕ Tic Tac Toe</h1>

  <div class="mode-select" id="modeSelect">
    <p data-i18n="chooseMode">Choisis un mode</p>
    <div class="mode-buttons">
      <button class="mode-btn" data-mode="bot">
        <span class="mode-icon">🤖</span>
        <span data-i18n="vsBot">Contre le bot</span>
      </button>
      <button class="mode-btn" data-mode="2p">
        <span class="mode-icon">🧑‍🤝‍🧑</span>
        <span data-i18n="vs2p">2 joueurs</span>
      </button>
    </div>
    <div class="actions">
      <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
    </div>
  </div>

  <div class="difficulty-select" id="difficultySelect" hidden>
    <p data-i18n="chooseDifficulty">Choisis la difficulté</p>
    <div class="difficulty-buttons">
      <button class="btn-small" data-difficulty="facile" data-i18n="easy">Facile</button>
      <button class="btn-small" data-difficulty="moyen" data-i18n="medium">Moyen</button>
      <button class="btn-small" data-difficulty="difficile" data-i18n="hard">Difficile</button>
    </div>
    <div class="actions">
      <button class="btn-small" id="backToModeBtn" data-i18n="back">Retour</button>
    </div>
  </div>

  <div id="gameArea" hidden>
    <div class="scoreboard" id="scoreboard"></div>
    <p id="status">À toi de jouer (X)</p>

    <div class="ttt-wrap">
      <div class="ttt-grid" id="grid"></div>
      <svg class="win-line-svg" id="winLineSvg" viewBox="0 0 100 100" preserveAspectRatio="none">
        <line id="winLine" x1="0" y1="0" x2="0" y2="0" />
      </svg>
    </div>

    <div class="actions">
      <button class="btn-small" id="changeModeBtn" data-i18n="changeMode">Changer mode</button>
      <a href="../index.html" class="btn-small" data-i18n="home">Accueil</a>
    </div>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 id="resultTitle"></h2>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn" data-i18n="replay">Rejouer</button>
        <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
      </div>
    </div>
  </div>

  <script src="../js/sfx.js"></script>
  <script type="module" src="../js/tictactoe.js"></script>
</body>
</html>
