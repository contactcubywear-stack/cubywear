<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>CubyWear – Memory</title>
  <link rel="icon" type="image/png" href="/assets/logo_dark.png">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/memory-select.css">
</head>

<body>

  <button id="langToggle" class="lang-toggle">FR</button>

  <h1 class="title">🧠 Memory</h1>
  <p class="subtitle" data-i18n="chooseLevel">Choisis ton niveau</p>

  <div class="difficulty-container">

    <button class="difficulty-btn facile" onclick="startMemory('facile')">
      <span class="diff-icon">🟢</span>
      <div class="diff-text">
        <h2 data-i18n="easy">Facile</h2>
        <p data-i18n="easyDesc">5 minutes · 30 essais · 4×4</p>
      </div>
    </button>

    <button class="difficulty-btn moyen" onclick="startMemory('moyen')">
      <span class="diff-icon">🟡</span>
      <div class="diff-text">
        <h2 data-i18n="medium">Moyen</h2>
        <p data-i18n="mediumDesc">3 minutes · 10 essais · 4×4</p>
      </div>
    </button>

    <button class="difficulty-btn difficile" onclick="startMemory('difficile')">
      <span class="diff-icon">🟠</span>
      <div class="diff-text">
        <h2 data-i18n="hard">Difficile</h2>
        <p data-i18n="hardDesc">1 minute · 5 essais · 6×6</p>
      </div>
    </button>

    <button class="difficulty-btn impossible" onclick="startMemory('impossible')">
      <span class="diff-icon">🔴</span>
      <div class="diff-text">
        <h2 data-i18n="impossible">Impossible</h2>
        <p data-i18n="impossibleDesc">30 secondes · 3 essais · 6×6</p>
      </div>
    </button>

  </div>

  <a href="../index.html" class="btn-small" data-i18n="back">Retour</a>

  <script src="../js/memory-select.js"></script>
</body>
</html>
