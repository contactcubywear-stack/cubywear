<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Cubiwear – Mot Flash</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/mot-flash.css">
</head>

<body>

  <h1>⚡ Mot Flash</h1>
  <p id="hud">Indice 1/10 · Temps : 10s</p>

  <div class="clue-box">
    <p id="clue">Indice ici</p>
    <input type="text" id="answerInput" placeholder="Ta réponse" autocomplete="off">
    <button class="btn-small" id="submitBtn">Valider</button>
  </div>

  <div class="actions">
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2>⚡ Terminé !</h2>
      <div class="win-stats">
        <p>Bonnes réponses : <span id="statScore"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/mot-flash.js"></script>
</body>
</html>
