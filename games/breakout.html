<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cubiwear – Breakout</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/breakout.css">
</head>

<body>

  <h1>🧱 Breakout</h1>
  <p id="hud">Score : 0 · Vies : 3</p>

  <div class="breakout-area" id="area">
    <canvas id="gameCanvas"></canvas>
    <div class="breakout-start" id="startOverlay">
      <button class="btn-small" id="startBtn">Lancer la balle</button>
    </div>
  </div>

  <p class="hint">Glisse, utilise les boutons ou les flèches pour déplacer la raquette</p>

  <div class="lane-buttons">
    <button class="btn-small" id="btnLeft" aria-label="Gauche">◀</button>
    <button class="btn-small" id="btnRight" aria-label="Droite">▶</button>
  </div>

  <div class="actions">
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 id="resultTitle"></h2>
      <div class="win-stats">
        <p>Score final : <span id="statScore"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/breakout.js"></script>
</body>
</html>
