<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>CubyWear – Breakout</title>
  <link rel="icon" type="image/png" href="/assets/logo_dark.png">

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/breakout.css">
</head>

<body>

  <button id="langToggle" class="lang-toggle">FR</button>

  <h1>🧱 Breakout</h1>

  <div class="difficulty-select" id="difficultySelect">
    <p data-i18n="chooseDifficulty">Choisis la difficulté</p>
    <div class="difficulty-buttons">
      <button class="btn-small" data-difficulty="facile" data-i18n="easy">Facile</button>
      <button class="btn-small" data-difficulty="moyen" data-i18n="medium">Moyen</button>
      <button class="btn-small" data-difficulty="difficile" data-i18n="hard">Difficile</button>
      <button class="btn-small" data-difficulty="impossible" data-i18n="impossible">Impossible</button>
    </div>
    <div class="actions">
      <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
    </div>
  </div>

  <div id="gameArea" hidden>
    <div class="stat-bar">
      <div class="stat-chip"><span class="stat-icon">⭐</span><span id="scoreVal">0</span></div>
      <div class="stat-chip"><span class="stat-icon">❤️</span><span id="livesVal">3</span></div>
      <div class="stat-chip"><span class="stat-icon">🏆</span><span id="bestVal">0</span></div>
    </div>

    <div class="breakout-area" id="area">
      <canvas id="gameCanvas"></canvas>
      <div class="breakout-start" id="startOverlay">
        <button class="btn-small" id="startBtn" data-i18n="launch">Lancer la balle</button>
      </div>
    </div>

    <p class="hint" data-i18n="hint">Glisse, utilise les boutons ou les flèches pour déplacer la raquette</p>

    <div class="lane-buttons">
      <button class="btn-small" id="btnLeft" aria-label="Gauche">◀</button>
      <button class="btn-small" id="btnRight" aria-label="Droite">▶</button>
    </div>

    <div class="actions">
      <a href="../index.html" class="btn-small" data-i18n="home">Accueil</a>
    </div>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2 id="resultTitle"></h2>
      <div class="win-stats">
        <p><span data-i18n="finalScore">Score final</span> : <span id="statScore"></span></p>
        <p><span data-i18n="best">Meilleur score</span> : <span id="statBest"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn" data-i18n="replay">Rejouer</button>
        <a href="../index.html" class="btn-small" data-i18n="mainMenu">Menu principal</a>
      </div>
    </div>
  </div>

  <script src="../js/sfx.js"></script>
  <script type="module" src="../js/breakout.js"></script>
</body>
</html>
