<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Cubiwear – Lettre manquante</title>

  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../css/lettre-manquante.css">
</head>

<body>

  <h1>🔡 Lettre manquante</h1>
  <p id="hud">Mot 1/10 · Score : 0</p>

  <p id="wordDisplay" class="word-display"></p>

  <div class="letter-choices" id="choices"></div>

  <div class="actions">
    <a href="../index.html" class="btn-small">Accueil</a>
  </div>

  <div class="win-modal" id="resultModal" hidden>
    <div class="win-modal-content">
      <h2>🔡 Terminé !</h2>
      <div class="win-stats">
        <p>Score final : <span id="statScore"></span></p>
      </div>
      <div class="win-actions">
        <button class="btn-small" id="replayBtn">Rejouer</button>
        <a href="../index.html" class="btn-small">Menu principal</a>
      </div>
    </div>
  </div>

  <script type="module" src="../js/lettre-manquante.js"></script>
</body>
</html>
