<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Cubiwear – Jeu du jour</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="bg-glow"></div>

  <img id="logoImg" class="logo-corner" src="assets/logo_dark.png" alt="Cubiwear">
  <button id="themeToggle" class="theme-toggle" aria-label="Changer de thème" title="Thème clair / sombre">🌙</button>
  <button id="musicToggle" class="theme-toggle music-toggle" aria-label="Musique de fond" title="Musique de fond">🔇</button>

  <header class="hero">
    <p class="date" id="currentDate"></p>
  </header>

  <!-- JEUX DU JOUR -->
  <section class="daily-section">
    <span class="daily-badge">🔥 JEUX DU JOUR</span>
    <div class="daily-games-grid" id="dailyGamesGrid"></div>
    <p class="daily-countdown" id="dailyCountdown">Prochains jeux dans --:--:--</p>
  </section>

  <!-- SHOP -->
  <div class="big-card shop-card" onclick="window.location.href='https://cubiwear.ca/shop'">
    <h3>🛍️ BOUTIQUE</h3>
    <p>Découvre les hoodies Cubiwear</p>
  </div>

  <!-- MODE ADMIN -->
  <details class="admin-card">
    <summary>⚙️ Admin — choisir les 3 jeux du jour</summary>
    <div class="admin-body">
      <select id="gameSelector1"></select>
      <select id="gameSelector2"></select>
      <select id="gameSelector3"></select>
      <button class="btn-big" onclick="setDailyGames()">Appliquer</button>
    </div>
  </details>

  <script src="main.js"></script>
</body>
</html>
