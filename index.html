<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cubiwear – Jeu du jour</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="bg-glow"></div>

  <header class="hero">
    <h1 class="title">🧊 Cubiwear</h1>
    <p class="subtitle">Scan. Play. Win.</p>
    <p class="date" id="currentDate"></p>
  </header>

  <!-- JEU DU JOUR -->
  <div class="big-card daily-card">
    <span class="daily-badge">🔥 JEU DU JOUR</span>
    <div class="daily-icon" id="dailyIcon">🎮</div>
    <h2 id="dailyGame">Chargement...</h2>
    <p id="dailyDesc">Un nouveau défi chaque jour</p>
    <a id="playButton" href="#" class="btn-big">JOUER</a>
  </div>

  <!-- TOUS LES JEUX -->
  <section class="all-games">
    <h3 class="section-title">🗂️ Tous les jeux</h3>
    <input type="text" id="gameSearch" class="game-search" placeholder="Rechercher un jeu...">
    <div class="game-grid" id="gameGrid"></div>
  </section>

  <!-- SHOP -->
  <div class="big-card shop-card" onclick="window.location.href='https://cubiwear.ca/shop'">
    <h3>🛍️ BOUTIQUE</h3>
    <p>Découvre les hoodies Cubiwear</p>
  </div>

  <!-- MODE ADMIN -->
  <details class="admin-card">
    <summary>⚙️ Mode test — changer le jeu du jour</summary>
    <div class="admin-body">
      <select id="gameSelector"></select>
      <button class="btn-big" onclick="setDailyGame()">Appliquer</button>
    </div>
  </details>

  <script src="main.js"></script>
</body>
</html>
