<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>(function(){try{if(localStorage.getItem("cubywearTheme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}})();</script>
  <title>Cubiwear – Jeu du jour</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="bg-glow"></div>

  <img id="logoImg" class="logo-corner" src="assets/logo_dark.png" alt="Cubiwear">

  <div class="settings-wrap">
    <button id="settingsBtn" class="settings-btn" aria-label="Paramètres" title="Paramètres">⚙️</button>
    <div id="settingsPanel" class="settings-panel" hidden>
      <div class="settings-row">
        <span data-i18n="settings.theme">Thème</span>
        <button id="themeToggle" class="pill-toggle">🌙</button>
      </div>
      <div class="settings-row">
        <span data-i18n="settings.sound">Son</span>
        <button id="musicToggle" class="pill-toggle">🔇</button>
      </div>
      <div class="settings-row">
        <span data-i18n="settings.language">Langue</span>
        <button id="langToggle" class="pill-toggle">FR</button>
      </div>
    </div>
  </div>

  <header class="hero">
    <p class="date" id="currentDate"></p>
  </header>

  <!-- JEUX DU JOUR -->
  <section class="daily-section">
    <span class="daily-badge" data-i18n="daily.badge">🔥 JEUX DU JOUR</span>
    <div class="daily-games-grid" id="dailyGamesGrid"></div>
    <p class="daily-countdown" id="dailyCountdown">--:--:--</p>
  </section>

  <!-- SHOP -->
  <div class="big-card shop-card" onclick="window.location.href='https://cubiwear.ca/shop'">
    <h3 data-i18n="shop.title">🛍️ BOUTIQUE</h3>
    <p data-i18n="shop.desc">Découvre les hoodies Cubiwear</p>
  </div>

  <!-- MODE ADMIN -->
  <details class="admin-card">
    <summary data-i18n="admin.summary">⚙️ Admin — choisir les 3 jeux du jour</summary>
    <div class="admin-body">
      <select id="gameSelector1"></select>
      <select id="gameSelector2"></select>
      <select id="gameSelector3"></select>
      <button class="btn-big" data-i18n="admin.apply" onclick="setDailyGames()">Appliquer</button>
    </div>
  </details>

  <script src="main.js"></script>
</body>
</html>
